name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NODE_VERSION: '22.23.5'
  PNPM_VERSION: '11.7.0'

jobs:
  engine:
    name: build engine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate smoke fixtures
        run: node scripts/make-fixtures.mjs

      - name: Cache pruned engine
        id: engine-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}\lo-engine.zip
          key: lo-engine-${{ hashFiles('resources/engine.json', 'scripts/prune-engine.ps1', 'scripts/build-engine.ps1') }}

      - name: Build engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-engine.ps1 -Version 25.8.7

      - name: Report engine zip
        shell: pwsh
        run: |
          $zip = "${{ runner.temp }}\lo-engine.zip"
          if (-not (Test-Path $zip)) { throw "engine zip missing at $zip" }
          Write-Host ("engine zip: {0:N1} MB" -f ((Get-Item $zip).Length / 1MB))

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lo-engine
          path: ${{ runner.temp }}\lo-engine.zip
          retention-days: 14
          compression-level: 0

  check:
    name: typecheck lint unit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:coverage

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: unit-results
          path: |
            test-results/unit-junit.xml
            coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: build app
    needs: [check]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: app-build
          path: out/
          retention-days: 3

  e2e:
    name: e2e with bundled engine
    needs: [engine, build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v6
        with:
          name: lo-engine
          path: ${{ runner.temp }}\lo-artifact

      - name: Unpack bundled engine into resources/lo
        shell: pwsh
        run: |
          Expand-Archive -Path "${{ runner.temp }}\lo-artifact\lo-engine.zip" -DestinationPath "${{ runner.temp }}\lo-tree" -Force
          New-Item -ItemType Directory -Force -Path resources/lo | Out-Null
          Copy-Item -Path "${{ runner.temp }}\lo-tree\*" -Destination resources/lo -Recurse -Force
          if (-not (Test-Path resources/lo/program/soffice.com)) { throw 'bundled soffice.com missing' }
          Get-ChildItem resources/lo | Select-Object -First 8

      - uses: actions/download-artifact@v6
        with:
          name: app-build
          path: out

      - name: Generate fixtures
        run: node scripts/make-fixtures.mjs

      - name: Run e2e
        run: pnpm e2e

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
