name: ci

# Frontend checks that survive the Tauri migration. The Electron build, packaging and
# e2e jobs moved out: the shell is now a Rust binary, so those jobs live in tauri.yml.
#
# The e2e suite is intentionally absent rather than silently skipped: it launched the
# app through Playwright's _electron fixture, which has no Tauri equivalent without a
# CDP harness. See tests/e2e/tauri.spec.ts for what it covered and how to restore it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PNPM_VERSION: 11.7.0
  NODE_VERSION: 24

jobs:
  check:
    name: typecheck lint unit
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate fixtures
        run: node scripts/make-fixtures.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test
