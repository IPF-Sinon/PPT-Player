name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0'
        required: true
      draft:
        description: 'Keep the release as a draft'
        type: boolean
        default: false

permissions:
  contents: write

env:
  NODE_VERSION: '22.23.5'
  PNPM_VERSION: '11.7.0'

jobs:
  ci:
    name: verify
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish
    needs: [ci]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache Electron binary
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-45.3.4-${{ runner.os }}

      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches the app version
        shell: pwsh
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -ne "v$version") {
            throw "tag $env:TAG does not match package.json version $version"
          }
          Write-Host "releasing $env:TAG"

      - uses: actions/download-artifact@v6
        with:
          name: lo-engine
          path: ${{ runner.temp }}\lo-artifact

      - name: Unpack bundled engine into resources/lo
        shell: pwsh
        run: |
          Expand-Archive -Path "${{ runner.temp }}\lo-artifact\lo-engine.zip" -DestinationPath "${{ runner.temp }}\lo-tree" -Force
          New-Item -ItemType Directory -Force -Path resources/lo | Out-Null
          Copy-Item -Path "${{ runner.temp }}\lo-tree\*" -Destination resources/lo -Recurse -Force
          if (-not (Test-Path resources/lo/program/soffice.com)) { throw 'bundled soffice.com missing' }

      - run: pnpm build

      # The engine zip is a release asset in its own right: the lite build downloads
      # it on demand, so its checksum has to be known before the lite package is built.
      - name: Build standalone engine archive
        shell: pwsh
        run: |
          $loVersion = (Get-Content resources/engine.json -Raw | ConvertFrom-Json).version
          $zipName = "PPTPlayer-Engine-$loVersion-win-x64.zip"
          New-Item -ItemType Directory -Force -Path dist-engine | Out-Null
          Compress-Archive -Path resources/lo/* -DestinationPath "dist-engine/$zipName" -CompressionLevel Optimal
          $zip = Get-Item "dist-engine/$zipName"
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "engine zip: $($zip.Name) $([math]::Round($zip.Length/1MB,1)) MB"
          "ENGINE_ZIP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ENGINE_ZIP_BYTES=$($zip.Length)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($zip.Length -gt 170MB) { throw "engine zip too large: $([math]::Round($zip.Length/1MB,1)) MB" }

      - name: Package full build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/set-variant.mjs full
          npx electron-builder --config electron-builder.yml --win nsis zip --x64 --publish never

      - name: Package lite build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/set-variant.mjs lite
          npx electron-builder --config electron-builder.lite.yml --win nsis zip --x64 --publish never

      - name: Verify artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -File | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
          $full = Get-ChildItem -Path dist -Filter 'PPTPlayer-Setup-*-full.exe' | Select-Object -First 1
          if ($null -eq $full) { throw 'full NSIS installer missing' }
          if ($full.Length -gt 600MB) { throw "full installer too large: $([math]::Round($full.Length/1MB,1)) MB" }

          $lite = Get-ChildItem -Path dist -Filter 'PPTPlayer-Setup-*-lite.exe' | Select-Object -First 1
          if ($null -eq $lite) { throw 'lite NSIS installer missing' }
          $liteMb = [math]::Round($lite.Length/1MB,1)
          Write-Host "lite installer: $liteMb MB"
          # Measured floor, not a guess: with zero runtime dependencies and Electron's
          # locale packs trimmed to zh-CN and en-US, the lite installer is 108.8 MB,
          # and essentially all of that is the Electron runtime itself. The engine
          # accounts for the 94.6 MB gap from the full build, so this budget still
          # catches the one regression that matters: the engine bundled again.
          if ($lite.Length -gt 112MB) { throw "lite installer too large: $liteMb MB, budget is 112 MB" }

          $liteZip = Get-ChildItem -Path dist -Filter 'PPTPlayer-*-x64-lite.zip' | Select-Object -First 1
          if ($null -eq $liteZip) { throw 'lite zip missing' }
          Expand-Archive -Path $liteZip.FullName -DestinationPath "${{ runner.temp }}\lite-check" -Force
          if (Test-Path "${{ runner.temp }}\lite-check\resources\lo") {
            throw 'lite package still contains resources/lo'
          }
          Write-Host 'lite package verified: no bundled engine'
          # The full build must stay clearly heavier. If the two converge, the engine
          # silently stopped being bundled into the full build.
          $gap = [math]::Round(($full.Length - $lite.Length)/1MB, 1)
          Write-Host "full minus lite: $gap MB"
          if ($gap -lt 60) { throw "engine gap too small: $gap MB, full build may be missing its engine" }

      - name: Write checksums
        shell: pwsh
        run: |
          Copy-Item -Path dist-engine -Destination dist -Recurse -Force
          $lines = Get-ChildItem -Path dist -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Path dist/sha256sums.txt -Encoding utf8
          Get-Content dist/sha256sums.txt

      - uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: PPT Player ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/sha256sums.txt
