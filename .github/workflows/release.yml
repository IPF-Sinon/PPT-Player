name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0'
        required: true

permissions:
  contents: write

env:
  NODE_VERSION: '22.23.5'
  PNPM_VERSION: '11.7.0'

jobs:
  ci:
    name: verify
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish
    needs: [ci]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache Electron binary
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-45.3.4-${{ runner.os }}

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v6
        with:
          name: lo-engine
          path: ${{ runner.temp }}\lo-artifact

      - name: Unpack bundled engine into resources/lo
        shell: pwsh
        run: |
          Expand-Archive -Path "${{ runner.temp }}\lo-artifact\lo-engine.zip" -DestinationPath "${{ runner.temp }}\lo-tree" -Force
          New-Item -ItemType Directory -Force -Path resources/lo | Out-Null
          Copy-Item -Path "${{ runner.temp }}\lo-tree\*" -Destination resources/lo -Recurse -Force
          if (-not (Test-Path resources/lo/program/soffice.com)) { throw 'bundled soffice.com missing' }

      - run: pnpm build

      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis zip --x64 --publish never

      - name: Verify artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -File | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
          $setup = Get-ChildItem -Path dist -Filter 'PPTPlayer-Setup-*.exe' | Select-Object -First 1
          if ($null -eq $setup) { throw 'NSIS installer missing' }
          if ($setup.Length -gt 600MB) { throw "installer too large: $([math]::Round($setup.Length/1MB,1)) MB, budget is 600 MB" }

      - name: Write checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem -Path dist -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Path dist/sha256sums.txt -Encoding utf8
          Get-Content dist/sha256sums.txt

      - uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: PPT Player ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/sha256sums.txt