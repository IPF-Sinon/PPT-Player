name: spike

# Answers three questions before any decision to migrate:
#   1. cold start to first painted frame, and the lite installer size
#   2. does WebView2 render the slide, the blurred toolbar, and canvas ink
#   3. does a custom protocol answer Range with 206 so pdf.js can stream
#
# Runs on windows-latest because the target is Windows and the webview runtime is
# what is being measured. The Electron code is untouched.

on:
  push:
    branches: [spike/tauri-coldstart]
  workflow_dispatch:

env:
  PNPM_VERSION: 11.7.0
  NODE_VERSION: 24

jobs:
  spike:
    name: build and measure
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            spike/src-tauri/target
          # The CLI is expensive and does not change with our manifest, so it gets a
          # stable key of its own; only the crate build is keyed on the manifest.
          key: spike-cargo-v1-${{ hashFiles('spike/src-tauri/Cargo.toml', 'spike/src-tauri/build.rs') }}
          restore-keys: |
            spike-cargo-v1-
            spike-cargo-

      # The CLI ships as an npm package with a prebuilt binary. Building it from source
      # cost about twelve minutes per run, and cargo-binstall does not start on this
      # image, so the npm package is the reliable path.
      - name: Install Tauri CLI
        shell: pwsh
        run: |
          npm install --no-save @tauri-apps/cli@2
          if ($LASTEXITCODE -ne 0) { throw "tauri cli install failed" }
          npx tauri --version

      - name: Stage a PDF for the range probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path spike/stage | Out-Null
          # Any multi-page PDF works; the size only needs to exceed one range window.
          $bytes = New-Object byte[] (2MB)
          (New-Object Random 42).NextBytes($bytes)
          [IO.File]::WriteAllBytes("spike/stage/deck.pdf", $bytes)
          Write-Host ("staged {0:N0} bytes" -f (Get-Item spike/stage/deck.pdf).Length)

      - name: Build spike
        shell: pwsh
        working-directory: spike/src-tauri
        run: |
          $env:SPIKE_PDF = (Resolve-Path ../stage/deck.pdf).Path
          cargo build --release 2>&1 | Tee-Object -FilePath ../../spike-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content ../../spike-build.log -Tail 60; throw "cargo build failed" }

      - name: Report binary size
        shell: pwsh
        run: |
          $exe = "spike/src-tauri/target/release/spike.exe"
          if (-not (Test-Path $exe)) { throw "exe missing" }
          $mb = (Get-Item $exe).Length / 1MB
          Write-Host ("spike.exe: {0:N1} MB" -f $mb)
          "SPIKE_EXE_MB={0:N1}" -f $mb | Tee-Object -FilePath spike-size.txt -Append

      - name: Package NSIS installer
        shell: pwsh
        working-directory: spike
        run: |
          npx tauri build --bundles nsis 2>&1 | Tee-Object -FilePath ../spike-package.log
          if ($LASTEXITCODE -ne 0) { Get-Content ../spike-package.log -Tail 60; throw "tauri build failed" }
          Get-ChildItem -Recurse -Include *.exe -Path src-tauri/target/release/bundle | ForEach-Object {
            Write-Host ("installer: {0} = {1:N1} MB" -f $_.Name, ($_.Length / 1MB))
            "SPIKE_INSTALLER_MB={0:N1} ({1})" -f ($_.Length / 1MB), $_.Name | Tee-Object -FilePath ../spike-size.txt -Append
          }

      - name: Launch and measure
        shell: pwsh
        run: |
          # Launch the release binary and wait for it to report, rather than sleeping a
          # fixed time: a fixed sleep either cuts the measurement short or inflates it.
          $exe = Resolve-Path "spike/src-tauri/target/release/spike.exe"
          $env:SPIKE_PDF = (Resolve-Path "spike/stage/deck.pdf").Path
          Remove-Item spike-run.err, spike-run.out -ErrorAction SilentlyContinue

          $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardError spike-run.err -RedirectStandardOutput spike-run.out

          # Wait for the final report, which carries the range result, up to 40s.
          $deadline = (Get-Date).AddSeconds(40)
          while ((Get-Date) -lt $deadline) {
            if (Test-Path spike-run.err) {
              $text = Get-Content spike-run.err -Raw -ErrorAction SilentlyContinue
              if ($text -and $text.Contains('notes:')) { break }
            }
            Start-Sleep -Milliseconds 400
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }

          Write-Host "--- stderr ---"
          if (Test-Path spike-run.err) { Get-Content spike-run.err | Tee-Object -FilePath spike-run.txt -Append }
          $paint = (Get-Content spike-run.err -ErrorAction SilentlyContinue | Select-String "painted_ms").Line
          if (-not $paint) { Write-Host "::warning::no paint measurement captured" } else { Write-Host $paint }

          # Second launch, same machine. WebView2 creates its user data directory on the
          # first run, which is a one-off cost; measuring again tells us whether the
          # 6.8 s figure is that cost or the steady state a user would actually see.
          Remove-Item spike-run2.err, spike-run2.out -ErrorAction SilentlyContinue
          $proc2 = Start-Process -FilePath $exe -PassThru -RedirectStandardError spike-run2.err -RedirectStandardOutput spike-run2.out
          $deadline2 = (Get-Date).AddSeconds(40)
          while ((Get-Date) -lt $deadline2) {
            if (Test-Path spike-run2.err) {
              $text2 = Get-Content spike-run2.err -Raw -ErrorAction SilentlyContinue
              if ($text2 -and $text2.Contains('notes:')) { break }
            }
            Start-Sleep -Milliseconds 400
          }
          if (-not $proc2.HasExited) { Stop-Process -Id $proc2.Id -Force }
          Write-Host "--- second launch (warm) ---"
          if (Test-Path spike-run2.err) { Get-Content spike-run2.err | Tee-Object -FilePath spike-run.txt -Append }

      # The Tauri number means nothing on its own. This builds and measures the current
      # Electron app the same way on the same machine, which is the only comparison that
      # answers "is switching worth it".
      - name: Build the Electron baseline
        run: |
          pnpm install --frozen-lockfile
          # The Electron binary is fetched on first use, so this is what makes the
          # dist directory exist at all.
          pnpm exec electron --version
          pnpm build

      - name: Measure Electron for comparison
        shell: pwsh
        run: |
          Write-Host "::group::electron baseline"
          $env:ELECTRON_DISABLE_SECURITY_WARNINGS = "true"
          $main = Resolve-Path "out/main/index.js"
          $exe = Resolve-Path "node_modules/electron/dist/electron.exe"
          # Two launches, mirroring the Tauri measurement: the first pays any one-off
          # cost, the second is what a user sees on a normal start.
          foreach ($pass in 1, 2) {
          $start = Get-Date
          $proc = Start-Process -FilePath $exe -ArgumentList $main -PassThru
          # Poll for the first window rather than sleeping: that is the moment a user
          # would see something appear.
          $firstWindow = $null
          $deadline = (Get-Date).AddSeconds(40)
          while ((Get-Date) -lt $deadline) {
            $proc.Refresh()
            try {
              if ($proc.MainWindowHandle -ne 0) { $firstWindow = ((Get-Date) - $start).TotalMilliseconds; break }
            } catch { }
            Start-Sleep -Milliseconds 100
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          if ($null -eq $firstWindow) {
            Write-Host "::warning::electron window never appeared (pass $pass)"
          } else {
            Write-Host ("ELECTRON_WINDOW_MS pass{0}={1:N0}" -f $pass, $firstWindow)
            ("ELECTRON_WINDOW_MS pass{0}={1:N0}" -f $pass, $firstWindow) | Tee-Object -FilePath spike-size.txt -Append
          }
          Start-Sleep -Seconds 2
          }
          Write-Host "::endgroup::"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: tauri-spike
          path: |
            spike/src-tauri/target/release/spike.exe
            spike/src-tauri/target/release/bundle/nsis/*.exe
            spike-size.txt
            spike-run.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Summarize
        if: always()
        shell: pwsh
        run: |
          "## Tauri spike" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if (Test-Path spike-size.txt) { Get-Content spike-size.txt | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append }
          if (Test-Path spike-run.txt) {
            "### runtime" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content spike-run.txt | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }