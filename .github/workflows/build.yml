name: build

# Rust and frontend checks for the Tauri shell. Kept separate from ci.yml so the
# Electron build keeps working while the migration is in progress.

on:
  push:
    branches: [main, feat/tauri-migration]
  pull_request:
    branches: [main, feat/tauri-migration]
  workflow_dispatch:

env:
  PNPM_VERSION: 11.7.0
  NODE_VERSION: 24

jobs:
  # A tag that disagrees with package.json would publish installers whose version
  # string contradicts the release name, so this is checked before anything is built.
  version:
    name: check version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check the tag matches the app version
        id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          publish=false
          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "$tag" ]; then
              echo "::error::tag $REF_NAME does not match package.json version $version"
              exit 1
            fi
            publish=true
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_PUBLISH" = "true" ]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "app version $version -> tag $tag publish=$publish"

  rust:
    name: cargo check and test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: tauri-rust-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/build.rs') }}
          restore-keys: tauri-rust-

      - name: Icon and frontend placeholder
        shell: pwsh
        run: |
          node scripts/make-tauri-icon.mjs
          # generate_context! reads the frontend dist at compile time and panics when
          # it is missing. The Rust job does not build the UI, so a placeholder is
          # written here; the packaging job builds the real one.
          New-Item -ItemType Directory -Force -Path out/renderer | Out-Null
          if (-not (Test-Path out/renderer/index.html)) {
            Set-Content -Path out/renderer/index.html -Value '<!doctype html><title>placeholder</title>'
          }

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all-targets 2>&1 | Tee-Object -FilePath ../cargo-test.log

      # Warnings are reported but do not fail the job while modules are still being
      # filled in; the last step flips this to a gate once the tree is complete.
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets 2>&1 | Tee-Object -FilePath ../cargo-clippy.log

  frontend:
    name: typecheck lint unit
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/make-fixtures.mjs

      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: unit
        run: pnpm test

  config:
    name: validate tauri configs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      # The two configs are the whole packaging contract, and both ways they can
      # break are silent until a Windows build has already been paid for: an
      # invalid bundle target, and the full config losing its engine mapping.
      - name: Assert the variant configs
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs'

          const read = (p) => JSON.parse(readFileSync(p, 'utf8'))
          const lite = read('src-tauri/tauri.conf.json')
          const full = read('src-tauri/tauri.full.conf.json')
          const problems = []

          // Tauri 2 rejects any target outside this set while parsing the config,
          // so a "zip" target here would fail the build rather than make a zip.
          const VALID = ['deb', 'rpm', 'appimage', 'pacman', 'msi', 'nsis', 'app', 'dmg']
          const targets = (lite.bundle?.targets ?? []).map((t) => String(t).toLowerCase())
          for (const t of targets) {
            if (!VALID.includes(t)) problems.push('lite bundle target "' + t + '" is not a Tauri 2 target')
          }
          if (!targets.includes('nsis')) problems.push('lite build must produce an NSIS installer')

          // Lite must carry no engine; that is the entire point of the variant.
          const res = lite.bundle?.resources
          const empty = res === undefined
            || (Array.isArray(res) && res.length === 0)
            || (typeof res === 'object' && Object.keys(res).length === 0)
          if (!empty) problems.push('lite config must bundle no resources, found ' + JSON.stringify(res))

          if (lite.mainBinaryName !== 'PPTPlayer') {
            problems.push('mainBinaryName must be PPTPlayer so the installer writes PPTPlayer.exe')
          }

          const nsis = lite.bundle?.windows?.nsis ?? {}
          if (nsis.installMode !== 'currentUser') {
            problems.push('NSIS installMode must be currentUser, found ' + JSON.stringify(nsis.installMode))
          }
          for (const lang of ['SimpChinese', 'English']) {
            if (!(nsis.languages ?? []).includes(lang)) problems.push('NSIS languages must include ' + lang)
          }

          // The full config is a merge patch, so it only carries the engine.
          // engine_resolve looks for resource_dir()/lo/program/soffice.com, and on
          // Windows the resource dir is the install dir, so the mapping must land
          // the tree under "lo".
          const fullRes = full.bundle?.resources
          if (!fullRes || Array.isArray(fullRes)) {
            problems.push('full config must map resources as an object, found ' + JSON.stringify(fullRes))
          } else {
            if (!Object.values(fullRes).includes('lo')) {
              problems.push('full config must map the engine tree to "lo", found ' + JSON.stringify(Object.values(fullRes)))
            }
            if (!Object.keys(fullRes).includes('../resources/lo')) {
              problems.push('full config must source the engine from ../resources/lo, found ' + JSON.stringify(Object.keys(fullRes)))
            }
          }

          if (problems.length > 0) {
            for (const p of problems) console.error('::error::' + p)
            process.exit(1)
          }
          console.log('tauri configs are consistent')
          EOF

  package:
    name: package windows
    # Two installers are slow and only meaningful on the migration branch, so pull
    # requests run the config check above without paying for them.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: tauri-package-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/build.rs') }}
          restore-keys: tauri-package-

      # The unpacked engine tree is what the full installer bundles. Cached so a
      # rerun does not have to unpack the LibreOffice payload again.
      - name: Restore bundled engine
        uses: actions/cache@v5
        with:
          path: resources/lo
          key: tauri-lo-tree-${{ hashFiles('resources/engine.json', 'scripts/prune-engine.ps1', 'scripts/build-engine.ps1') }}
          restore-keys: tauri-lo-tree-

      - name: Icon
        shell: pwsh
        run: node scripts/make-tauri-icon.mjs

      - run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      # The CLI ships as an npm package with a prebuilt binary. Installing it from
      # source took about twelve minutes a run, and cargo-binstall does not start on
      # this image, so the package is the reliable path.
      #
      # It is installed in its own directory: running npm install at the repo root
      # fails with EUNSUPPORTEDPROTOCOL because the workspace packages use the
      # "workspace:*" protocol, which npm cannot resolve.
      - name: Install Tauri CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\tauri-cli" | Out-Null
          Push-Location "$env:RUNNER_TEMP\tauri-cli"
          Set-Content -Path package.json -Value '{"name":"cli","private":true}'
          npm install @tauri-apps/cli@2 --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw 'tauri cli install failed' }
          Pop-Location
          # The binary is invoked by absolute path from here on.
          "$env:RUNNER_TEMP\tauri-cli\node_modules\.bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$env:RUNNER_TEMP\tauri-cli\node_modules\.bin\tauri.cmd" --version

      # The engine zip used to be produced by ci.yml and pulled across the cache, but
      # that workflow no longer builds it, so the cache is always empty and the full
      # installer was skipped on every run. It is built here instead, cached on the
      # scripts that define its contents, and a miss is not fatal: the lite build is
      # the one that has to work unconditionally.
      - name: Restore the engine zip
        id: engine-zip
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/lo-engine.zip
          key: lo-engine-${{ hashFiles('resources/engine.json', 'scripts/prune-engine.ps1', 'scripts/build-engine.ps1') }}
          restore-keys: lo-engine-

      - name: Build the engine zip
        if: steps.engine-zip.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # The build script converts a smoke deck to prove the engine works, so the
          # fixtures have to exist first.
          node scripts/make-fixtures.mjs
          ./scripts/build-engine.ps1 -Version 25.8.7
          if (-not (Test-Path "${{ runner.temp }}/lo-engine.zip")) { throw 'engine zip was not produced' }
          Write-Host ("engine zip: {0:N1} MB" -f ((Get-Item "${{ runner.temp }}/lo-engine.zip").Length / 1MB))

      - name: Save the engine zip
        if: steps.engine-zip.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/lo-engine.zip
          key: lo-engine-${{ hashFiles('resources/engine.json', 'scripts/prune-engine.ps1', 'scripts/build-engine.ps1') }}

      - name: Stage the engine tree
        shell: pwsh
        run: |
          if (Test-Path 'resources/lo/program/soffice.com') {
            Write-Host 'engine tree already present'
            exit 0
          }
          $zip = Join-Path ${{ runner.temp }} 'lo-engine.zip'
          if (-not (Test-Path $zip)) {
            Write-Host '::warning::no cached engine zip, the full installer will be skipped'
            exit 0
          }
          $tree = Join-Path ${{ runner.temp }} 'lo-tree'
          Expand-Archive -Path $zip -DestinationPath $tree -Force
          New-Item -ItemType Directory -Force -Path resources/lo | Out-Null
          Copy-Item -Path (Join-Path $tree '*') -Destination resources/lo -Recurse -Force
          if (-not (Test-Path 'resources/lo/program/soffice.com')) { throw 'staged engine has no soffice.com' }
          Write-Host 'engine staged into resources/lo'

      - name: Detect bundled engine
        id: engine
        shell: pwsh
        run: |
          if (Test-Path 'resources/lo/program/soffice.com') {
            'present=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            'present=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host '::warning::resources/lo is absent, skipping the full installer'
          }

      # Lite is built first, and the release directory is cleaned first: the cargo
      # target directory is restored from cache, so a previous full build can leave
      # an engine next to the binary that a lite build would never remove (its
      # resource list is empty, so nothing overwrites it). Left in place it would
      # end up inside the lite zip and quietly delete the point of the variant.
      - name: Clean stale engine from the release directory
        shell: pwsh
        run: |
          foreach ($stale in 'src-tauri/target/release/lo', 'src-tauri/target/release/resources') {
            if (Test-Path $stale) {
              Write-Host ('removing stale ' + $stale)
              Remove-Item -Recurse -Force $stale
            }
          }

      - name: Build lite
        shell: pwsh
        run: |
          tauri build --config src-tauri/tauri.conf.json --bundles nsis 2>&1 | Tee-Object -FilePath tauri-lite.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content tauri-lite.log -Tail 80
            throw 'tauri build (lite) failed'
          }

      - name: Smoke test lite
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/PPTPlayer.exe'
          if (-not (Test-Path $exe)) { throw 'lite release exe missing' }
          $out = Join-Path ${{ runner.temp }} 'smoke-lite.out'
          $err = Join-Path ${{ runner.temp }} 'smoke-lite.err'
          Remove-Item $out, $err -ErrorAction SilentlyContinue

          # A GUI binary with no console still writes to redirected handles, and the
          # app logs '[startup] renderer ready' to stderr and to its log file. The
          # window handle is the fallback, so a renderer that never reports in does
          # not fail the build on its own. No GPU is required: WebView2 falls back
          # to software rendering on the runner.
          # The log lives in app data and survives between steps, so a stale line
          # from an earlier launch would let this pass without the app starting.
          $log = Join-Path $env:APPDATA 'com.ipf.sinon.pptplayer\config\ppt-player.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue

          $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          $deadline = (Get-Date).AddSeconds(90)
          $ready = $false
          $exitedEarly = $false
          while ((Get-Date) -lt $deadline) {
            $proc.Refresh()
            if ($proc.HasExited) { $exitedEarly = $true; break }
            if ($proc.MainWindowHandle -ne 0) { $ready = $true; break }
            if ((Test-Path $err) -and ((Get-Content $err -Raw -ErrorAction SilentlyContinue) -match 'renderer ready')) { $ready = $true; break }
            if ((Test-Path $log) -and ((Get-Content $log -Raw -ErrorAction SilentlyContinue) -match 'renderer ready')) { $ready = $true; break }
            Start-Sleep -Milliseconds 300
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }

          Write-Host '--- stderr ---'
          if (Test-Path $err) { Get-Content $err | Select-Object -Last 40 }

          if (-not $ready) {
            if ($exitedEarly) { throw 'lite smoke test failed: the app exited before it reported ready' }
            throw 'lite smoke test failed: no window and no ready log within 90s'
          }
          Write-Host 'lite smoke test passed'

      - name: Package lite artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $installer = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'lite NSIS installer missing' }

          $liteMb = [math]::Round($installer.Length / 1MB, 2)
          Write-Host ('lite installer: {0} MB' -f $liteMb)
          ('LITE_INSTALLER_MB=' + $liteMb) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          # The gate is the point of the lite variant. The Electron lite build is
          # 108.8 MB, almost all of it the Electron runtime; a Tauri build that
          # ships no engine has no business near 20 MB, and a number above it means
          # the engine or a webview runtime came along by accident.
          if ($installer.Length -ge 20MB) {
            throw ('lite installer is ' + $liteMb + ' MB, the budget is 20 MB')
          }
          Copy-Item $installer.FullName 'artifacts/PPTPlayer-Setup-x64-lite.exe' -Force

          $stage = Join-Path ${{ runner.temp }} 'lite-zip'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'src-tauri/target/release/PPTPlayer.exe' $stage
          if (Test-Path 'src-tauri/target/release/resources') {
            Copy-Item 'src-tauri/target/release/resources' $stage -Recurse
          }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath 'artifacts/PPTPlayer-x64-lite.zip' -CompressionLevel Optimal -Force

          # The lite package must not carry an engine. If it does, the two variants
          # have collapsed into one and the on-demand download path is dead code.
          $check = Join-Path ${{ runner.temp }} 'lite-check'
          if (Test-Path $check) { Remove-Item -Recurse -Force $check }
          Expand-Archive -Path 'artifacts/PPTPlayer-x64-lite.zip' -DestinationPath $check -Force
          if (Test-Path (Join-Path $check 'lo')) { throw 'lite zip contains a bundled engine' }
          if (Test-Path (Join-Path $check 'resources/lo')) { throw 'lite zip contains a bundled engine' }
          Write-Host 'lite artifacts verified'

      - name: Build full
        if: steps.engine.outputs.present == 'true'
        shell: pwsh
        run: |
          # Both variants produce PPTPlayer_<version>_x64-setup.exe, so the lite
          # installer is still sitting in this folder. Clearing it first means the
          # full packaging step can only ever pick up the full build's output.
          if (Test-Path 'src-tauri/target/release/bundle/nsis') {
            Remove-Item -Recurse -Force 'src-tauri/target/release/bundle/nsis'
          }
          tauri build --config src-tauri/tauri.full.conf.json --bundles nsis 2>&1 | Tee-Object -FilePath tauri-full.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content tauri-full.log -Tail 80
            throw 'tauri build (full) failed'
          }

      - name: Verify the full build staged the engine
        if: steps.engine.outputs.present == 'true'
        shell: pwsh
        run: |
          # tauri-build copies configured resources next to the release binary, so
          # this is the same tree the installer will place at <install>/lo, which is
          # what engine_resolve reads as resource_dir()/lo.
          if (-not (Test-Path 'src-tauri/target/release/lo/program/soffice.com')) {
            throw 'full build did not stage the engine next to the binary'
          }
          Write-Host 'full build staged resources/lo'

      - name: Smoke test full
        if: steps.engine.outputs.present == 'true'
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/PPTPlayer.exe'
          if (-not (Test-Path $exe)) { throw 'full release exe missing' }
          $out = Join-Path ${{ runner.temp }} 'smoke-full.out'
          $err = Join-Path ${{ runner.temp }} 'smoke-full.err'
          Remove-Item $out, $err -ErrorAction SilentlyContinue
          # Same reason as the lite smoke test: a stale log would fake a pass.
          $log = Join-Path $env:APPDATA 'com.ipf.sinon.pptplayer\config\ppt-player.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue

          $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          $deadline = (Get-Date).AddSeconds(90)
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            $proc.Refresh()
            if ($proc.HasExited) { break }
            if ($proc.MainWindowHandle -ne 0) { $ready = $true; break }
            if ((Test-Path $err) -and ((Get-Content $err -Raw -ErrorAction SilentlyContinue) -match 'renderer ready')) { $ready = $true; break }
            if ((Test-Path $log) -and ((Get-Content $log -Raw -ErrorAction SilentlyContinue) -match 'renderer ready')) { $ready = $true; break }
            Start-Sleep -Milliseconds 300
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }

          Write-Host '--- stderr ---'
          if (Test-Path $err) { Get-Content $err | Select-Object -Last 40 }
          if (-not $ready) { throw 'full smoke test failed: no window and no ready log within 90s' }
          Write-Host 'full smoke test passed'

      - name: Package full artifacts
        if: steps.engine.outputs.present == 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'full NSIS installer missing' }
          $fullMb = [math]::Round($installer.Length / 1MB, 2)
          Write-Host ('full installer: {0} MB' -f $fullMb)
          ('FULL_INSTALLER_MB=' + $fullMb) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Copy-Item $installer.FullName 'artifacts/PPTPlayer-Setup-x64-full.exe' -Force

          $stage = Join-Path ${{ runner.temp }} 'full-zip'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'src-tauri/target/release/PPTPlayer.exe' $stage
          Copy-Item 'src-tauri/target/release/lo' $stage -Recurse
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath 'artifacts/PPTPlayer-x64-full.zip' -CompressionLevel Optimal -Force
          Write-Host 'full artifacts packaged'

      - name: Report artifact sizes
        shell: pwsh
        run: |
          if (-not (Test-Path artifacts)) { throw 'no artifacts were produced' }
          Get-ChildItem -Path artifacts -File | ForEach-Object {
            Write-Host ('{0} = {1:N1} MB' -f $_.Name, ($_.Length / 1MB))
          }
          '### packaged artifacts' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-ChildItem -Path artifacts -File | ForEach-Object {
            ('- ' + $_.Name + ' (' + [math]::Round($_.Length / 1MB, 1) + ' MB)') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: tauri-windows
          path: artifacts/*
          retention-days: 14
          if-no-files-found: error

      - name: Build logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tauri-build-logs
          path: |
            tauri-lite.log
            tauri-full.log
          retention-days: 7
          if-no-files-found: ignore

  # Publishing is the last step and the only one that writes outside the repository.
  # It runs only for a version tag, or for a manual run that explicitly asks for it,
  # so merging to main can never ship by accident.
  publish:
    name: publish release
    needs: [version, package]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: tauri-windows
          path: artifacts

      - name: Write checksums
        run: |
          cd artifacts
          # Sorted so the file is stable between runs, which makes it comparable.
          sha256sum * | sort -k2 > sha256sums.txt
          cat sha256sums.txt

      - name: Publish
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: PPT Player ${{ needs.version.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            artifacts/PPTPlayer-Setup-x64-lite.exe
            artifacts/PPTPlayer-x64-lite.zip
            artifacts/PPTPlayer-Setup-x64-full.exe
            artifacts/PPTPlayer-x64-full.zip
            artifacts/sha256sums.txt
          body: |
            Tauri 2 shell, replacing the Electron runtime.

            Lite (PPTPlayer-Setup-x64-lite.exe): the app alone. It opens PDF and PPTX
            directly; other formats offer to download the compatibility engine on
            first use.

            Full (PPTPlayer-Setup-x64-full.exe): ships the pruned LibreOffice engine,
            so every format works offline.

            sha256sums.txt covers every file above.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
