name: build

# The one workflow. Every push is checked, every push to main is packaged, and a
# version tag publishes a release.
#
# Three triggers, one pipeline:
#   pull_request  -> check only. Packaging costs twenty minutes and proves nothing
#                    that a merge would not prove anyway.
#   push to main  -> check, package, and keep the installers as artifacts. This is the
#                    continuous build: whatever is on main has been built and smoke
#                    tested, so a release is never the first time a change is packaged.
#   tag v*        -> the same build, published as a GitHub release.
#
# The tag is the only thing that publishes. A merge to main cannot accidentally ship.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release from this run (tag must match package.json)'
        type: boolean
        default: false

env:
  PNPM_VERSION: 11.7.0
  NODE_VERSION: 24

jobs:
  # A tag that disagrees with package.json would publish installers whose version
  # string contradicts the release name, so this is checked before anything is built.
    name: check version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check the tag matches the app version
        id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"

          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "$tag" ]; then
              echo "::error::tag $REF_NAME does not match package.json version $version"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_PUBLISH" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "app version $version -> tag $tag"

  rust:
