name: tauri

# Rust and frontend checks for the Tauri shell. Kept separate from ci.yml so the
# Electron build keeps working while the migration is in progress.

on:
  push:
    branches: [feat/tauri-migration]
  pull_request:
    branches: [feat/tauri-migration]
  workflow_dispatch:

env:
  PNPM_VERSION: 11.7.0
  NODE_VERSION: 24

jobs:
  rust:
    name: cargo check and test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: tauri-rust-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/build.rs') }}
          restore-keys: tauri-rust-

      - name: Icon
        shell: pwsh
        run: node scripts/make-tauri-icon.mjs

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all-targets 2>&1 | Tee-Object -FilePath ../cargo-test.log

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings 2>&1 | Tee-Object -FilePath ../cargo-clippy.log

  frontend:
    name: typecheck lint unit
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/make-fixtures.mjs

      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: unit
        run: pnpm test
