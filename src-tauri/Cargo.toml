[package]
name = "ppt-player"
version = "1.0.0"
description = "PPT player with native OOXML rendering"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ppt_player_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon is what TrayIconBuilder needs; without the feature the tray module does
# not exist at all.
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ZIP central directory walking and inflate, replacing node:zlib.
flate2 = "1"
# SHA256 for engine downloads, matching the Electron implementation.
sha2 = "0.10"
# Stable per-deck and per-slide identifiers.
uuid = { version = "1", features = ["v4"] }
# Settings and ink live under the app data dir.
dirs = "6"
# Native file and folder pickers, matching the dialogs the Electron build used.
rfd = "0.15"
# Opening the log file and cache folder in the shell.
opener = "0.7"
# A second launch must focus the existing window and hand it the file, which is what
# Electron's second-instance event did.
tauri-plugin-single-instance = "2"
# Preload at login: registers the login entry, and reports whether it is registered so
# the tray checkbox and the settings UI can show the real state.
tauri-plugin-autostart = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
# The lite installer budget depends on this: strip and optimise for size.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true