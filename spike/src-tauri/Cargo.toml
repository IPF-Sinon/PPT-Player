[package]
name = "spike"
version = "0.1.0"
description = "Cold-start and protocol spike for the Tauri decision"
edition = "2021"
rust-version = "1.77"

# Desktop only, so the mobile crate types are dropped; keeping them made the build
# produce libraries nobody loads.
[lib]
name = "spike_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"